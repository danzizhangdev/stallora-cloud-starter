server:
  port: 8082
spring:
  application:
    name: sample-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sample}
    username: ${DB_USER:stallora}
    password: ${DB_PASSWORD:stallora}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    template:
      observation-enabled: true      # carries the trace across Kafka
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
stallora:
  sample:
    auth-base-url: ${AUTH_URI:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
